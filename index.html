<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Devlith Educa - Escolha seu município</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--brand:#1B4F9B;--surface:#F1F5F9;--border:#E2E8F0;--text:#1E293B;--muted:#64748B;}
body{
  font-family:'Inter',sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  background-color:var(--surface);
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  top:-60px;
  right:-60px;
  width:420px;
  height:520px;
  background-image:url("devlith-swoosh.jpg");
  background-size:cover;
  background-position:center;
  border-radius:0 0 0 60px;
  -webkit-mask-image:radial-gradient(circle at top right, black 30%, transparent 72%);
  mask-image:radial-gradient(circle at top right, black 30%, transparent 72%);
  opacity:.9;
  z-index:0;
}
body::after{
  content:"";
  position:fixed;
  bottom:-80px;
  left:-80px;
  width:340px;
  height:420px;
  background-image:url("devlith-swoosh.jpg");
  background-size:cover;
  background-position:center;
  transform:rotate(180deg);
  -webkit-mask-image:radial-gradient(circle at bottom left, black 25%, transparent 70%);
  mask-image:radial-gradient(circle at bottom left, black 25%, transparent 70%);
  opacity:.6;
  z-index:0;
}
.wrap{max-width:520px;width:100%;text-align:center;position:relative;z-index:1;}
.top-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
.top-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),#3B6FC4);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:0 3px 10px rgba(27,79,155,.35);
}
.logo{font-size:24px;font-weight:800;color:var(--brand);letter-spacing:.3px;}
.subt{font-size:14px;color:var(--muted);margin-bottom:34px;}
.opcoes{display:flex;flex-direction:column;gap:14px;}
.opcao{
  display:flex;
  align-items:center;
  gap:16px;
  background:white;
  border:1.5px solid var(--border);
  border-radius:16px;
  padding:22px 20px;
  text-decoration:none;
  color:var(--text);
  box-shadow:0 4px 16px rgba(15,35,70,.06);
  transition:border-color .15s, transform .15s, box-shadow .15s;
  text-align:left;
}
.opcao:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 22px rgba(27,79,155,.15);}
.opcao-ico{
  flex-shrink:0;
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(135deg,#EEF4FF,#DCE9FD);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
}
.opcao-tit{font-size:17px;font-weight:800;margin-bottom:2px;}
.opcao-desc{font-size:12.5px;color:var(--muted);}
.opcao-seta{margin-left:auto;color:var(--brand);font-size:20px;font-weight:700;flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div class="top-icon">&#127891;</div>
    <div class="logo">DEVLITH EDUCA</div>
  </div>
  <div class="subt">Escolha o seu município para continuar</div>
  <div class="opcoes">
    <a class="opcao" href="cadastro.html">
      <div class="opcao-ico">&#127970;</div>
      <div>
        <div class="opcao-tit">Araruama</div>
        <div class="opcao-desc">Portal de cadastro - SEDUC Araruama</div>
      </div>
      <div class="opcao-seta">&#8594;</div>
    </a>
    <a class="opcao" href="cadastro-cabofrio.html">
      <div class="opcao-ico">&#127970;</div>
      <div>
        <div class="opcao-tit">Cabo Frio</div>
        <div class="opcao-desc">Portal de cadastro - SEME Cabo Frio</div>
      </div>
      <div class="opcao-seta">&#8594;</div>
    </a>
  </div>
</div>
</body>
</html>
